version: '3.8'

services:
  # Frontend Client (React + Vite + Nginx)
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mintu-portfolio-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - portfolio-network

  # Backend Server (Node.js + Express + SQLite / PostgreSQL)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:8080
      - DIALECT=sqlite
      - STORAGE_PATH=/app/data/portfolio.sqlite
    volumes:
      - ./server/data:/app/data
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
